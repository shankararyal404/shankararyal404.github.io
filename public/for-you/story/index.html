<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>For You 🌻</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        const token = sessionStorage.getItem('forYouSession');
        if (!token) {
            window.location.href = '/for-you/';
        }
    </script>
    
    <style>
        :root {
            --cream: #fff8e7;
            --cream-light: #fffbf0;
            --gold: #f4c167;
            --brown: #8B6914;
            --navy: #070720;
            --pink: #fff0f5;
            --white: #f9f9f9;
            --dark: #0a0a1a;
            
            --font-title: 'Dancing Script', cursive;
            --font-body: 'Quicksand', sans-serif;
            
            --transition-speed: 0.8s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-body);
            color: var(--brown);
            overflow: hidden;
            background-color: var(--cream);
            height: 100vh;
            width: 100vw;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #audioToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        #audioToggle:hover {
            transform: scale(1.1);
        }

        #slidesContainer {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
            transition: transform var(--transition-speed) cubic-bezier(0.645, 0.045, 0.355, 1), 
                        opacity var(--transition-speed) ease;
            padding: 20px 20px 80px 20px;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
            z-index: 5;
        }

        .slide.prev {
            transform: translateX(-100%);
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(139, 105, 20, 0.15);
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .media-container {
            width: 80%;
            max-width: 400px;
            aspect-ratio: 4/5;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(139, 105, 20, 0.2);
            position: relative;
            background-color: white;
            border: 8px solid white;
            transform: rotate(-2deg);
            transition: transform 0.4s ease;
        }
        
        .media-container:hover {
            transform: rotate(1deg) scale(1.02);
        }

        .media-container.polaroid {
            aspect-ratio: 1/1;
            padding-bottom: 40px;
        }

        .media-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        h1, h2 {
            font-family: var(--font-title);
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        
        h1 {
            font-size: 3.5rem;
        }

        h2 {
            font-size: 2.5rem;
        }

        p, .quote {
            font-size: 1.2rem;
            line-height: 1.6;
            margin: 10px 0;
            max-width: 600px;
        }
        
        .quote {
            font-style: italic;
            font-weight: 500;
        }

        /* Nav */
        #navigation {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--gold);
            color: var(--brown);
            padding: 10px 20px;
            border-radius: 30px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: var(--gold);
            color: white;
            transform: translateY(-2px);
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        .nav-btn.hidden {
            visibility: hidden;
            opacity: 0;
        }
        
        .nav-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        #pageIndicator {
            font-weight: 500;
            color: rgba(139, 105, 20, 0.6);
            font-size: 0.9rem;
            background: rgba(255,255,255,0.5);
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* Specific Page Styles */
        #page1 {
            background-color: var(--navy);
            color: var(--cream);
        }
        #page1 h1, #page1 h2 {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(244, 193, 103, 0.5);
        }
        
        #page2 { background-color: var(--cream); }
        #page3 { background-color: var(--cream); }
        #page4 { background-color: var(--cream-light); }
        #page5 { background-color: var(--white); }
        #page6 { background-color: var(--cream); }
        #page7 { background-color: var(--cream); }
        #page8 { background-color: var(--cream); }
        #page9 { background-color: var(--cream); }
        
        #page10 { background-color: var(--pink); }
        
        #page11 {
            background-color: var(--dark);
            color: var(--gold);
        }
        
        #page12 {
            background-color: #fffaf0;
            padding: 40px;
        }
        
        .letter-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(139, 105, 20, 0.1);
            max-width: 600px;
            width: 90%;
            text-align: left;
            position: relative;
            border: 1px solid rgba(244, 193, 103, 0.3);
            margin: 0 auto;
        }
        
        .letter-container::before {
            content: "🌻";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            background: #fffaf0;
            border-radius: 50%;
            padding: 5px;
        }
        
        .letter-text {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 20px;
            white-space: pre-line;
        }
        
        .signature {
            font-family: var(--font-title);
            font-size: 1.8rem;
            text-align: right;
            margin-top: 30px;
            color: var(--gold);
        }

        /* Polaroid Row */
        .polaroid-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .polaroid-row .media-container {
            width: 45%;
            margin: 0;
            transform: rotate(random(-5deg, 5deg));
        }
        .polaroid-row .media-container:nth-child(1) { transform: rotate(-4deg); }
        .polaroid-row .media-container:nth-child(2) { transform: rotate(3deg); }
        
        /* Tags for Page 7 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            max-width: 500px;
        }
        
        .tag {
            background: white;
            border: 1px solid var(--gold);
            color: var(--brown);
            padding: 8px 20px;
            border-radius: 20px;
            font-family: var(--font-title);
            font-size: 1.4rem;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: 0 4px 8px rgba(139, 105, 20, 0.1);
        }
        
        .slide.active .tag {
            animation: fadeInUp 0.5s forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Error state */
        .media-error {
            display: none;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            color: var(--brown);
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        
        /* Video */
        video {
            border-radius: 4px;
        }

        /* Confetti */
        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            h2 { font-size: 2rem; }
            .polaroid-row { flex-direction: column; align-items: center; }
            .polaroid-row .media-container { width: 70%; margin-bottom: 20px; }
            #navigation { padding: 0 10px; }
            .nav-btn { padding: 8px 15px; font-size: 0.9rem; }
            .letter-container { padding: 30px 20px; }
            .letter-text { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="confettiCanvas" style="display: none;"></canvas>

    <button id="audioToggle">
        <span class="icon">🔇</span>
    </button>
    <audio id="bgMusic" loop preload="none"></audio>

    <div id="slidesContainer">
        <!-- Pages will be injected here via JS -->
    </div>

    <div id="navigation">
        <button id="btnPrev" class="nav-btn hidden">← Back</button>
        <div id="pageIndicator">1 of 12</div>
        <button id="btnNext" class="nav-btn">Next →</button>
    </div>

    <script>
        // --- DATA ---
        const MEDIA = {
            audio: 'love-song.mp3',
            p1: 'teddywithsunflower.jpg',
            p2: 'teddywithcapandsunflower.jpg',
            p3: 'bunnywithsunflower.jpg',
            p4: 'teddysunflower.jpg',
            p5: 'teddykissingsunflower.jpg',
            p6a: 'teddybunny.jpg',
            p6b: 'teddysunflower.jpg',
            p7: 'sunflowers.jpg',
            p8: 'teddywithcake.jpg',
            p9: 'teddywithsunflowercute.jpg',
            p10: 'teddybunnycute.jpg',
        };

        const pages = [
            {
                id: 'page1',
                content: `
                    <h2>✨ 🌙 ✨</h2>
                    <h1>It's 12:00 AM</h1>
                    <h2>and a very special day begins...</h2>
                    <div class="media-container skeleton" data-media="p1">
                        <img class="media-element" alt="Teddy with sunflower">
                        <div class="media-error">Could not load image</div>
                    </div>
                `
            },
            {
                id: 'page2',
                content: `
                    <h2>🎉 🎊 🎈</h2>
                    <h1>Happy Birthday!</h1>
                    <h2>My Sunshine 🌻</h2>
                    <div class="media-container skeleton" data-media="p2">
                        <img class="media-element" alt="Teddy cap">
                        <div class="media-error">Could not load image</div>
                    </div>
                `
            },
            {
                id: 'page3',
                content: `
                    <div class="media-container skeleton" data-media="p3">
                        <img class="media-element" alt="Bunny sunflower">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <p class="quote">"You make my world so much brighter ♡"</p>
                `
            },
            {
                id: 'page4',
                content: `
                    <div class="media-container polaroid skeleton" data-media="p4">
                        <img class="media-element" alt="Teddy sunflower">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <p class="quote">"Your smile is my favorite thing ♡"</p>
                `
            },
            {
                id: 'page5',
                content: `
                    <div class="media-container skeleton" data-media="p5">
                        <img class="media-element" alt="Teddy kissing">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <p class="quote">"Thank you for coming into my life and making it so beautiful ♡"</p>
                `
            },
            {
                id: 'page6',
                content: `
                    <div class="polaroid-row">
                        <div class="media-container polaroid skeleton" data-media="p6a">
                            <img class="media-element" alt="Teddy bunny">
                            <div class="media-error">Could not load image</div>
                        </div>
                        <div class="media-container polaroid skeleton" data-media="p6b">
                            <img class="media-element" alt="Teddy sunflower">
                            <div class="media-error">Could not load image</div>
                        </div>
                    </div>
                    <br>
                    <p class="quote">"Every moment with you is my favorite memory ♡"</p>
                `
            },
            {
                id: 'page7',
                content: `
                    <div class="media-container skeleton" data-media="p7">
                        <img class="media-element" alt="Sunflowers">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <h1>You are...</h1>
                    <div class="tags-container">
                        <div class="tag" style="animation-delay: 0.1s">kind ♡</div>
                        <div class="tag" style="animation-delay: 0.3s">beautiful ♡</div>
                        <div class="tag" style="animation-delay: 0.5s">strong ♡</div>
                        <div class="tag" style="animation-delay: 0.7s">amazing ♡</div>
                        <div class="tag" style="animation-delay: 1.0s; background: var(--gold); color: white; border: none;">and mine 😊</div>
                    </div>
                `
            },
            {
                id: 'page8',
                content: `
                    <div class="media-container skeleton" data-media="p8">
                        <img class="media-element" alt="Teddy cake">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <p class="quote">"I hope your day is as wonderful as your heart ♡"</p>
                `
            },
            {
                id: 'page9',
                content: `
                    <div class="media-container skeleton" data-media="p9">
                        <img class="media-element" alt="Teddy cute">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <p class="quote">"May all your dreams come true my love 🌻"</p>
                `
            },
            {
                id: 'page10',
                content: `
                    <div class="media-container skeleton" data-media="p10">
                        <img class="media-element" alt="Teddy bunny cute">
                        <div class="media-error">Could not load image</div>
                    </div>
                    <h1>Happy Birthday My Love ♡</h1>
                    <p class="quote">"I love you more than words can say"</p>
                `
            },
            {
                id: 'page11',
                content: `
                    <div class="letter-container">
                        <h1 style="text-align: center; color: var(--gold); margin-bottom: 20px;">My Dearest,</h1>
                        <div class="letter-text">Happy Birthday, my beautiful sunflower. 🌻

As I write this, I can't help but smile thinking about you. From the moment you came into my life, everything just got brighter, warmer, and endlessly better. Just like a sunflower turning towards the light, my heart always finds its way to you.

Your smile is the most beautiful thing I've ever seen, and making you happy is my favorite thing to do. Thank you for your kindness, your warmth, and the amazing love you share with me every single day. You make even the simplest moments feel incredibly special.

Today is all about you—celebrating the wonderful, strong, and beautiful person you are. I hope your birthday is filled with as much joy, laughter, and sunshine as you bring into my world. 

I promise to keep loving you, cherishing you, and holding your hand through all our adventures to come. Here is to celebrating you today, and loving you forever.

Have the happiest birthday, my love.</div>
                        <div class="signature">Forever Yours, 💛</div>
                    </div>
                    <br>
                    <button id="btnRestart" class="nav-btn" style="background: var(--gold); color: white;">← Back to Beginning</button>
                `
            }
        ];

        // --- STATE & CACHE ---
        let currentSlide = 0;
        const totalSlides = pages.length;
        const mediaCache = {};
        let isAudioInit = false;
        let isPlaying = false;
        
        const container = document.getElementById('slidesContainer');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const indicator = document.getElementById('pageIndicator');
        const audio = document.getElementById('bgMusic');
        const audioToggle = document.getElementById('audioToggle');
        
        // --- INIT PAGES ---
        pages.forEach((page, index) => {
            const div = document.createElement('div');
            div.className = \`slide \${index === 0 ? 'active' : ''}\`;
            div.id = page.id;
            div.innerHTML = page.content;
            container.appendChild(div);
        });

        const slides = document.querySelectorAll('.slide');

        // --- MEDIA LOADING ---
        async function fetchMediaUrl(filename) {
            if (mediaCache[filename]) return mediaCache[filename];
            const token = sessionStorage.getItem('forYouSession');
            try {
                const response = await fetch(`/api/for-you-media?file=${filename}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    mediaCache[filename] = data.url;
                    return data.url;
                }
            } catch (e) {
                console.error("Media fetch error", e);
            }
            return null;
        }

        async function loadMediaForSlide(slideIndex) {
            if (slideIndex < 0 || slideIndex >= totalSlides) return;
            
            const slide = slides[slideIndex];
            const containers = slide.querySelectorAll('.media-container');
            
            for (let c of containers) {
                if (c.classList.contains('loaded')) continue;
                
                const mediaKey = c.dataset.media;
                if (!mediaKey) continue;
                
                const filename = MEDIA[mediaKey];
                const url = await fetchMediaUrl(filename);
                
                const el = c.querySelector('.media-element');
                const err = c.querySelector('.media-error');
                
                if (url) {
                    el.src = url;
                    
                    if (el.tagName === 'IMG') {
                        el.onload = () => {
                            el.style.display = 'block';
                            c.classList.remove('skeleton');
                            c.classList.add('loaded');
                        };
                        el.onerror = () => {
                            c.classList.remove('skeleton');
                            err.style.display = 'flex';
                        }
                    } else if (el.tagName === 'VIDEO') {
                        el.onloadeddata = () => {
                            el.style.display = 'block';
                            c.classList.remove('skeleton');
                            c.classList.add('loaded');
                        };
                        el.onerror = () => {
                            c.classList.remove('skeleton');
                            err.style.display = 'flex';
                        }
                    }
                } else {
                    c.classList.remove('skeleton');
                    err.style.display = 'flex';
                }
            }
        }

        // Preload next slide media
        function preloadSurrounding() {
            loadMediaForSlide(currentSlide);
            loadMediaForSlide(currentSlide + 1);
        }

        // --- AUDIO ---
        async function initAudio() {
            if (!isAudioInit) {
                const url = await fetchMediaUrl(MEDIA.audio);
                if (url) {
                    audio.src = url;
                    audio.volume = 0.5;
                    isAudioInit = true;
                    toggleAudio();
                }
            }
        }

        function toggleAudio() {
            if (!isAudioInit) {
                initAudio();
                return;
            }
            
            if (isPlaying) {
                audio.pause();
                audioToggle.innerHTML = '<span class="icon">🔇</span>';
                isPlaying = false;
            } else {
                audio.play().then(() => {
                    audioToggle.innerHTML = '<span class="icon">🔊</span>';
                    isPlaying = true;
                }).catch(e => console.log("Audio play blocked", e));
            }
        }

        audioToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleAudio();
        });

        // --- NAVIGATION ---
        function updateNav() {
            indicator.textContent = \`\${currentSlide + 1} of \${totalSlides}\`;
            
            if (currentSlide === 0) {
                btnPrev.classList.add('hidden');
            } else {
                btnPrev.classList.remove('hidden');
            }

            if (currentSlide === totalSlides - 1) {
                btnNext.classList.add('hidden');
            } else {
                btnNext.classList.remove('hidden');
            }
            
            // Audio logic: keep audio toggle visible and playing smoothly
            audioToggle.style.display = 'flex';
            if (isPlaying && audio.paused && isAudioInit) {
                audio.play().catch(e => console.log(e));
            }
            
            preloadSurrounding();
        }

        function goToSlide(index) {
            if (index < 0 || index >= totalSlides) return;
            
            // First interaction plays audio if not started
            if (!isAudioInit && index > 0) initAudio();
            
            const prevIndex = currentSlide;
            currentSlide = index;
            
            slides.forEach((slide, i) => {
                if (i < currentSlide) {
                    slide.className = 'slide prev';
                } else if (i === currentSlide) {
                    slide.className = 'slide active';
                } else {
                    slide.className = 'slide';
                }
            });
            
            updateNav();
        }

        btnPrev.addEventListener('click', () => goToSlide(currentSlide - 1));
        btnNext.addEventListener('click', () => goToSlide(currentSlide + 1));
        
        // Restart button on page 12
        document.getElementById('btnRestart').addEventListener('click', () => goToSlide(0));

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                goToSlide(currentSlide + 1);
            } else if (e.key === 'ArrowLeft') {
                goToSlide(currentSlide - 1);
            }
        });

        // First click anywhere tries to start audio
        document.body.addEventListener('click', () => {
            if (!isAudioInit) initAudio();
        }, { once: true });


        // --- ANIMATIONS (Hearts & Confetti) ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const confCanvas = document.getElementById('confettiCanvas');
        const confCtx = confCanvas.getContext('2d');
        
        let hearts = [];
        let confettis = [];
        
        function resize() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            confCanvas.width = window.innerWidth;
            confCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Hearts
        for(let i=0; i<30; i++) {
            hearts.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                size: Math.random() * 5 + 3,
                speed: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.5 + 0.1,
                color: Math.random() > 0.5 ? '#f4c167' : '#ffffff' // gold and white
            });
        }
        
        // Confetti
        const colors = ['#f4c167', '#8B6914', '#fff8e7', '#ff6b6b', '#4ecdc4'];
        for(let i=0; i<100; i++) {
            confettis.push({
                x: Math.random() * confCanvas.width,
                y: Math.random() * confCanvas.height - confCanvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                speedY: Math.random() * 3 + 2,
                speedX: Math.random() * 2 - 1,
                rot: Math.random() * 360,
                rotSpeed: Math.random() * 5 - 2.5
            });
        }
        
        function drawHeart(ctx, x, y, size, color, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.fillStyle = color;
            // Simple heart path
            ctx.moveTo(0, size / 4);
            ctx.quadraticCurveTo(0, 0, size / 2, 0);
            ctx.quadraticCurveTo(size, 0, size, size / 2.5);
            ctx.quadraticCurveTo(size, size, 0, size * 1.5);
            ctx.quadraticCurveTo(-size, size, -size, size / 2.5);
            ctx.quadraticCurveTo(-size, 0, -size / 2, 0);
            ctx.quadraticCurveTo(0, 0, 0, size / 4);
            ctx.fill();
            ctx.restore();
        }
        
        function animate() {
            // Hearts
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // Only draw hearts if not on page 11 (surprise)
            if (currentSlide !== 10) {
                hearts.forEach(h => {
                    h.y -= h.speed;
                    if(h.y < -20) {
                        h.y = bgCanvas.height + 20;
                        h.x = Math.random() * bgCanvas.width;
                    }
                    drawHeart(bgCtx, h.x, h.y, h.size, h.color, h.opacity);
                });
            }
            
            // Confetti
            if (currentSlide === 10) {
                confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
                confettis.forEach(c => {
                    c.y += c.speedY;
                    c.x += c.speedX;
                    c.rot += c.rotSpeed;
                    
                    if(c.y > confCanvas.height) {
                        c.y = -20;
                        c.x = Math.random() * confCanvas.width;
                    }
                    
                    confCtx.save();
                    confCtx.translate(c.x, c.y);
                    confCtx.rotate(c.rot * Math.PI / 180);
                    confCtx.fillStyle = c.color;
                    confCtx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
                    confCtx.restore();
                });
            }
            
            requestAnimationFrame(animate);
        }
        
        // Start
        updateNav();
        animate();
    </script>
</body>
</html>
