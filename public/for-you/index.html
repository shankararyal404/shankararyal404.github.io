<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>For You 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#070720;font-family:'Quicksand',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,#1a0a3d 0%,#070720 50%,#0d1a3d 100%);z-index:0}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) var(--delay,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.1;transform:scale(0.8)}100%{opacity:1;transform:scale(1.2)}}
.float-el{position:fixed;z-index:1;pointer-events:none;animation:floatUp var(--d,8s) var(--delay,0s) linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px) rotate(360deg);opacity:0}}
.container{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(244,193,103,0.25);border-radius:32px;padding:40px 36px 36px;width:100%;max-width:380px;box-shadow:0 0 60px rgba(244,193,103,0.1),0 25px 50px rgba(0,0,0,0.5);text-align:center}
.moon{font-size:40px;margin-bottom:8px;animation:moonGlow 3s ease-in-out infinite alternate}
@keyframes moonGlow{0%{filter:drop-shadow(0 0 8px rgba(244,193,103,0.5))}100%{filter:drop-shadow(0 0 20px rgba(244,193,103,0.9))}}
.title{font-family:'Dancing Script',cursive;font-size:42px;color:#f4c167;text-shadow:0 0 30px rgba(244,193,103,0.5);margin-bottom:4px}
.subtitle{font-size:13px;color:#c8a96e;letter-spacing:1px;margin-bottom:28px}
.dots{display:flex;gap:12px;justify-content:center;margin-bottom:8px;min-height:24px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(244,193,103,0.5);background:transparent;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.dot.filled{background:#f4c167;border-color:#f4c167;box-shadow:0 0 12px rgba(244,193,103,0.6);transform:scale(1.15)}
.dot.error{border-color:#ff6b6b;background:#ff6b6b;box-shadow:0 0 12px rgba(255,107,107,0.6)}
.dots.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
.err-msg{font-size:12px;color:#ff8888;min-height:18px;margin-bottom:12px;transition:opacity .3s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.num-btn{width:65px;height:65px;border-radius:50%;background:rgba(255,255,255,0.07);border:1.5px solid rgba(244,193,103,0.2);color:#f4c167;font-size:22px;font-family:'Quicksand',sans-serif;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;margin:auto;position:relative;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
.num-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgba(244,193,103,0.2),transparent);opacity:0;transition:opacity .2s}
.num-btn:hover{border-color:rgba(244,193,103,0.5);background:rgba(244,193,103,0.1);transform:scale(1.05)}
.num-btn:active,.num-btn.pressed{transform:scale(0.9);background:rgba(244,193,103,0.2);border-color:#f4c167}
.num-btn.empty{visibility:hidden}
.num-btn.del-btn{font-size:20px}
.confirm-btn{width:65px;height:65px;border-radius:50%;background:linear-gradient(135deg,#f4c167,#e8960f);border:none;color:#1a0d00;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:auto;transition:all .2s;box-shadow:0 4px 15px rgba(244,193,103,0.4);font-weight:700}
.confirm-btn:hover{transform:scale(1.08);box-shadow:0 6px 25px rgba(244,193,103,0.6)}
.confirm-btn:active{transform:scale(0.92)}
.confirm-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spinner{width:20px;height:20px;border:2.5px solid rgba(26,13,0,0.3);border-top-color:#1a0d00;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stars" id="stars"></div>
<div class="container">
<div class="card">
  <div class="moon">🌙</div>
  <h1 class="title">For You</h1>
  <p class="subtitle">Enter your secret PIN ✨</p>
  <div class="dots" id="dots"></div>
  <div class="err-msg" id="err-msg"></div>
  <div class="pad" id="pad"></div>
</div>
</div>
<script>
// Generate stars
const starsEl=document.getElementById('stars');
for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2.5+0.5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;`;starsEl.appendChild(s);}
// Floating emojis
const floatEls=['💛','🌻','✨','💫','⭐','🌟','💕'];
for(let i=0;i<12;i++){const f=document.createElement('div');f.className='float-el';f.textContent=floatEls[Math.floor(Math.random()*floatEls.length)];f.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*16}px;--d:${6+Math.random()*10}s;--delay:${Math.random()*10}s;`;document.body.appendChild(f);}

const PIN_LEN=8;
let currentPin='';
let otpToken=null;
let loading=false;

// Build dots
const dotsEl=document.getElementById('dots');
for(let i=0;i<PIN_LEN;i++){const d=document.createElement('div');d.className='dot';d.id='dot'+i;dotsEl.appendChild(d);}

// Build pad
const padEl=document.getElementById('pad');
const keys=['1','2','3','4','5','6','7','8','9','del','0','confirm'];
keys.forEach(k=>{
  if(k==='confirm'){const b=document.createElement('button');b.className='confirm-btn';b.id='confirm-btn';b.innerHTML='&#10003;';b.disabled=true;b.onclick=submitPin;padEl.appendChild(b);return;}
  const b=document.createElement('button');
  if(k==='del'){b.className='num-btn del-btn';b.innerHTML='&#9003;';b.onclick=()=>deleteLast();}
  else{b.className='num-btn';b.textContent=k;b.onclick=()=>pressKey(k);}
  b.addEventListener('pointerdown',()=>{b.classList.add('pressed');});
  b.addEventListener('pointerup',()=>{setTimeout(()=>b.classList.remove('pressed'),150);});
  padEl.appendChild(b);
});

function updateDots(){
  for(let i=0;i<PIN_LEN;i++){const d=document.getElementById('dot'+i);d.classList.toggle('filled',i<currentPin.length);d.classList.remove('error');}
  document.getElementById('confirm-btn').disabled=(currentPin.length!==PIN_LEN||loading);
}
function pressKey(k){
  if(currentPin.length>=PIN_LEN||loading)return;
  currentPin+=k;updateDots();setErr('');
}
function deleteLast(){if(loading)return;currentPin=currentPin.slice(0,-1);updateDots();setErr('');}
function setErr(msg){const e=document.getElementById('err-msg');e.textContent=msg;e.style.opacity=msg?'1':'0';}

async function submitPin(){
  if(currentPin.length!==PIN_LEN||loading)return;
  loading=true;
  const btn=document.getElementById('confirm-btn');
  const spinner=document.createElement('div');spinner.className='spinner';
  btn.innerHTML='';btn.appendChild(spinner);btn.disabled=true;
  try{
    const r=await fetch('/api/for-you-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:currentPin})});
    const d=await r.json();
    if(r.ok&&d.success){sessionStorage.setItem('forYouOTP',d.otpToken);window.location.href='/for-you/otp/';}
    else{
      dotsEl.classList.add('shake');
      for(let i=0;i<PIN_LEN;i++)document.getElementById('dot'+i).classList.add('error');
      setTimeout(()=>{dotsEl.classList.remove('shake');},600);
      setErr(d.error||'Incorrect PIN. Please try again.');
      currentPin='';updateDots();
    }
  }catch(e){setErr('Connection error. Please try again.');}
  finally{loading=false;btn.innerHTML='&#10003;';btn.disabled=currentPin.length!==PIN_LEN;}
}

document.addEventListener('keydown',e=>{
  if(e.key>='0'&&e.key<='9')pressKey(e.key);
  else if(e.key==='Backspace')deleteLast();
  else if(e.key==='Enter')submitPin();
});
</script>
</body>
</html>
