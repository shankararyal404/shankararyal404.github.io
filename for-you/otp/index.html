<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Verify Code 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#070720;font-family:'Quicksand',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 80% 50%,#1a0a3d 0%,#070720 50%,#0d1a3d 100%);z-index:0}
.stars{position:fixed;inset:0;z-index:1;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) var(--delay,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:0.1}100%{opacity:1}}
.float-el{position:fixed;z-index:1;pointer-events:none;animation:floatUp var(--d,8s) var(--delay,0s) linear infinite}
@keyframes floatUp{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100px);opacity:0}}
.container{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(244,193,103,0.25);border-radius:32px;padding:44px 36px;width:100%;max-width:400px;box-shadow:0 0 60px rgba(244,193,103,0.1),0 25px 50px rgba(0,0,0,0.5);text-align:center}
.icon{font-size:48px;margin-bottom:10px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.title{font-family:'Dancing Script',cursive;font-size:36px;color:#f4c167;text-shadow:0 0 30px rgba(244,193,103,0.4);margin-bottom:6px}
.subtitle{font-size:13px;color:#c8a96e;margin-bottom:4px}
.email-hint{font-size:14px;color:#f4c167;font-weight:600;margin-bottom:24px;letter-spacing:.5px}
.otp-boxes{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.otp-box{width:48px;height:58px;border-radius:12px;border:2px solid rgba(244,193,103,0.3);background:rgba(255,255,255,0.05);color:#f4c167;font-size:24px;font-weight:700;text-align:center;font-family:'Quicksand',sans-serif;transition:all .2s;outline:none;caret-color:transparent}
.otp-box:focus{border-color:#f4c167;background:rgba(244,193,103,0.1);box-shadow:0 0 15px rgba(244,193,103,0.3)}
.otp-box.filled{border-color:#f4c167;background:rgba(244,193,103,0.08)}
.otp-box.error{border-color:#ff6b6b;background:rgba(255,107,107,0.1);animation:shake .4s ease both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}
.timer{font-size:13px;color:#c8a96e;margin-bottom:16px}
.timer span{color:#f4c167;font-weight:700;font-size:15px}
.err-msg{font-size:12px;color:#ff8888;min-height:18px;margin-bottom:12px}
.submit-btn{width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#f4c167,#e8960f);border:none;color:#1a0d00;font-size:16px;font-weight:700;cursor:pointer;font-family:'Quicksand',sans-serif;transition:all .2s;box-shadow:0 4px 15px rgba(244,193,103,0.3)}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(244,193,103,0.5)}
.submit-btn:active{transform:translateY(0)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.resend-btn{background:none;border:1px solid rgba(244,193,103,0.3);color:#c8a96e;font-size:12px;padding:8px 20px;border-radius:10px;cursor:pointer;font-family:'Quicksand',sans-serif;margin-top:12px;transition:all .2s}
.resend-btn:hover:not(:disabled){border-color:#f4c167;color:#f4c167}
.resend-btn:disabled{opacity:.4;cursor:not-allowed}
.back-link{display:block;margin-top:14px;color:#665577;font-size:12px;text-decoration:none;cursor:pointer;transition:color .2s}
.back-link:hover{color:#c8a96e}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(26,13,0,0.3);border-top-color:#1a0d00;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="stars" id="stars"></div>
<div class="container">
<div class="card">
  <div class="icon">💌</div>
  <h1 class="title">Check Your Email!</h1>
  <p class="subtitle">A secret code was sent to</p>
  <p class="email-hint" id="email-hint">ga****@gmail.com</p>
  <div class="otp-boxes" id="otp-boxes"></div>
  <div class="timer" id="timer">Code expires in: <span id="countdown">5:00</span></div>
  <div class="err-msg" id="err-msg"></div>
  <button class="submit-btn" id="submit-btn" onclick="submitOTP()">Unlock the Surprise ✨</button>
  <button class="resend-btn" id="resend-btn" onclick="resendCode()" disabled>Resend Code</button>
  <a class="back-link" onclick="window.location.href='/for-you/'">← Back to PIN</a>
</div>
</div>
<script>
const starsEl=document.getElementById('stars');
for(let i=0;i<100;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2.5+0.5;s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*5}s;`;starsEl.appendChild(s);}
const floatEls=['💛','✨','💌','💫','⭐'];for(let i=0;i<8;i++){const f=document.createElement('div');f.className='float-el';f.textContent=floatEls[i%floatEls.length];f.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*14}px;--d:${7+Math.random()*8}s;--delay:${Math.random()*8}s;`;document.body.appendChild(f);}

const otpToken=sessionStorage.getItem('forYouOTP');
if(!otpToken){window.location.href='/for-you/';}

// Build OTP boxes
const boxesEl=document.getElementById('otp-boxes');
const boxes=[];
for(let i=0;i<6;i++){const inp=document.createElement('input');inp.type='text';inp.inputMode='numeric';inp.maxLength=1;inp.className='otp-box';inp.id='otp'+i;
inp.addEventListener('input',e=>{const v=e.target.value.replace(/\D/g,'');inp.value=v;inp.classList.toggle('filled',!!v);if(v&&i<5)boxes[i+1].focus();checkComplete();});
inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0){boxes[i-1].focus();boxes[i-1].value='';boxes[i-1].classList.remove('filled');}if(e.key==='Enter')submitOTP();});
inp.addEventListener('paste',e=>{e.preventDefault();const txt=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);txt.split('').forEach((c,idx)=>{if(boxes[idx]){boxes[idx].value=c;boxes[idx].classList.add('filled');}});if(txt.length>0)boxes[Math.min(txt.length-1,5)].focus();checkComplete();});
boxes.push(inp);boxesEl.appendChild(inp);}

function getOTP(){return boxes.map(b=>b.value).join('');}
function checkComplete(){document.getElementById('submit-btn').disabled=getOTP().length!==6;}
checkComplete();

// Timer
let timeLeft=5*60,timerInterval,resendTimeout;
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec;}
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;document.getElementById('countdown').textContent=formatTime(timeLeft);
    if(timeLeft<=0){clearInterval(timerInterval);document.getElementById('timer').innerHTML='<span style="color:#ff8888">Code expired. Please resend.</span>';document.getElementById('submit-btn').disabled=true;}
  },1000);
}
startTimer();
function startResendTimer(){
  const rb=document.getElementById('resend-btn');rb.disabled=true;
  let t=60;
  resendTimeout=setInterval(()=>{t--;rb.textContent='Resend Code ('+t+'s)';if(t<=0){clearInterval(resendTimeout);rb.disabled=false;rb.textContent='Resend Code';}},1000);
}
startResendTimer();

async function resendCode(){
  const r=await fetch('/api/for-you-pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:sessionStorage.getItem('forYouPinVerified')||'20620416'})});
  // Note: resend is best done by going back to PIN page
  window.location.href='/for-you/';
}

async function submitOTP(){
  const otp=getOTP();if(otp.length!==6)return;
  const btn=document.getElementById('submit-btn');
  btn.innerHTML='<span class="spinner"></span> Verifying...';
  btn.disabled=true;
  setErr('');
  try{
    const r=await fetch('/api/for-you-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({otp,otpToken})});
    const d=await r.json();
    if(r.ok&&d.success){
      sessionStorage.setItem('forYouSession',d.sessionToken);
      btn.innerHTML='🌟 Opening your surprise...';
      btn.style.background='linear-gradient(135deg,#56d496,#2eb872)';
      setTimeout(()=>window.location.href='/for-you/story/',800);
    } else {
      boxes.forEach(b=>b.classList.add('error'));
      setTimeout(()=>boxes.forEach(b=>b.classList.remove('error')),500);
      setErr(d.error||'Invalid code. Please try again.');
      btn.innerHTML='Unlock the Surprise ✨';
      btn.disabled=false;
    }
  }catch(e){setErr('Connection error. Try again.');btn.innerHTML='Unlock the Surprise ✨';btn.disabled=getOTP().length!==6;}
}
function setErr(m){const e=document.getElementById('err-msg');e.textContent=m;}
</script>
</body>
</html>
