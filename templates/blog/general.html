<section class="section blog-single blog-general">
    <div class="container">
        <a href="/blogs/index.html" class="btn-link">← Back to Blogs</a>

        <article class="blog-content general-article glass-panel">
            <header>
                <h1 class="h1">{{BLOG_TITLE}}</h1>
                <div class="meta">
                    <span>{{BLOG_DATE}}</span> •
                    <a href="/blogs/tags/{{BLOG_CATEGORY_SLUG}}.html" class="category-tag">{{BLOG_CATEGORY}}</a>
                </div>
            </header>

            <div class="blog-cover">
                <img src="{{BLOG_IMAGE}}" alt="{{BLOG_TITLE}}" width="1200" height="630" loading="eager">
            </div>

            <div class="markdown-body">
                {{BLOG_BODY}}
            </div>

            <div class="tags-container">
                <span>Tags:</span>
                {{BLOG_TAGS}}
            </div>

            <div id="comment-widget-container" class="comments-section"
                style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--white-alpha-10);">
            </div>
            <link rel="stylesheet" href="/assets/css/comment-widget.css">
            <script src="/assets/js/comment-widget.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    initCommentWidget({
                        postSlug: '{{BLOG_SLUG}}',
                        containerId: 'comment-widget-container'
                    });
                });
            </script>
        </article>
    </div>
</section>
