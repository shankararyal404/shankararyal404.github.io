<section class="section blog-single blog-study">
    <div class="container">
        <a href="/blogs/index.html" class="btn-link">← Back to Blogs</a>

        <article class="blog-content study-article">
            <header class="study-header">
                <div class="study-badge">{{BLOG_CATEGORY}}</div>
                <h1 class="study-title">{{BLOG_TITLE}}</h1>
                <div class="study-meta">
                    <span><ion-icon name="calendar-outline"></ion-icon> {{BLOG_DATE}}</span>
                    <span>•</span>
                    <span><ion-icon name="book-outline"></ion-icon> Study Material</span>
                </div>
            </header>

            <div class="study-cover">
                <img src="{{BLOG_IMAGE}}" alt="{{BLOG_TITLE}}" width="1200" height="630" loading="eager">
            </div>

            <div class="study-content markdown-body">
                {{BLOG_BODY}}
            </div>

            <div class="tags-container">
                <span><ion-icon name="pricetags-outline"></ion-icon> Topics:</span>
                {{BLOG_TAGS}}
            </div>

            <div id="comment-widget-container" class="comments-section"
                style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--white-alpha-10);">
            </div>
            <link rel="stylesheet" href="/assets/css/comment-widget.css">
            <script src="/assets/js/comment-widget.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    initCommentWidget({
                        postSlug: '{{BLOG_SLUG}}',
                        containerId: 'comment-widget-container'
                    });
                });
            </script>
        </article>
    </div>
</section>
