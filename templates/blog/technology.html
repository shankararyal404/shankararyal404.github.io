<section class="section blog-single blog-technology">
    <div class="container">
        <a href="/blogs/index.html" class="btn-link">← Back to Blogs</a>

        <article class="blog-content tech-article">
            <header class="tech-header">
                <div class="tech-category">{{BLOG_CATEGORY}}</div>
                <h1 class="tech-title">{{BLOG_TITLE}}</h1>
                <div class="tech-meta">
                    <span>{{BLOG_DATE}}</span>
                    <span>•</span>
                    <span>5 min read</span>
                </div>
            </header>

            <div class="tech-cover">
                <img src="{{BLOG_IMAGE}}" alt="{{BLOG_TITLE}}" width="1200" height="630" loading="eager">
            </div>

            <div class="tech-content markdown-body">
                {{BLOG_BODY}}
            </div>

            <div class="tags-container">
                <span>Tags:</span>
                {{BLOG_TAGS}}
            </div>

            <div id="comment-widget-container" class="comments-section"
                style="margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--white-alpha-10);">
            </div>
            <link rel="stylesheet" href="/assets/css/comment-widget.css">
            <script src="/assets/js/comment-widget.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    initCommentWidget({
                        postSlug: '{{BLOG_SLUG}}',
                        containerId: 'comment-widget-container'
                    });
                });
            </script>
        </article>
    </div>
</section>
